[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = tests/test_*.py
python_classes = Test*
python_functions = test_*
# Run with: pytest -v  (from the backend/ directory with venv active)
# DB: uses DATABASES from config.settings — points at Postgres via .env
# The test runner creates and destroys test_<POSTGRES_DB> automatically.
# Do NOT pass --reuse-db unless you know the schema is unchanged;
# a fresh DB is the safe default.
addopts = -v --tb=short
